<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#121316">
<title>LLM-CP chat</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<!-- The page of llmcp-chat. chat.wasm (cmd/chat-web) draws the chats on the canvas with Go UI.
     The bar to write is a plain form under it, because Go UI cannot yet open a phone's on-screen
     keyboard in a browser; the Go program shows it, and says which chat it writes to. -->
<style>
  :root { color-scheme: dark; --ground: #121316; --pane: rgba(255, 255, 255, 0.06); --line: rgba(255, 255, 255, 0.10);
          --ink: #eceef0; --ink-soft: #9aa3ad; --accent: #00897B; --radius: 18px;
          --bar: #2C313B; --bar-line: #363C48; --idle: #363C48; }
  body[data-mode="light"] { color-scheme: light; --ground: #F4F4F6; --ink: #1B1B1F; --ink-soft: #5E616A;
          --bar: #FFFFFF; --bar-line: #D5D6DD; --idle: #E9E9EE; }
  html, body { margin: 0; height: 100%; background: var(--ground); overflow: hidden; }
  body { display: flex; flex-direction: column; height: 100dvh; font: 16px system-ui, sans-serif; color: var(--ink); }
  canvas { display: block; width: 100%; flex: 1; min-height: 0; }
  #message { position: fixed; inset: 0; display: grid; place-items: center; color: var(--ink-soft); }
  /* the bar is laid over the room the Go program leaves for it at the foot of the open chat */
  form { display: none; position: fixed; box-sizing: border-box; padding: 0 12px; align-items: center; }
  body[data-writing] form { display: flex; }
  .bar { flex: 1; }
  .bar { display: flex; align-items: center; gap: 6px; background: var(--bar); border: 1px solid var(--bar-line); border-radius: 26px;
         padding: 5px 5px 5px 18px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3); transition: border-color .2s ease, box-shadow .2s ease; }
  .bar:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(0, 137, 123, 0.18), 0 6px 18px rgba(0, 0, 0, 0.3); }
  input { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: transparent; border: 0; padding: 10px 0; outline: none; }
  input::placeholder { color: var(--ink-soft); }
  button { width: 42px; height: 42px; flex: none; border: 0; border-radius: 50%; display: grid; place-items: center;
           background: var(--idle); color: var(--ink-soft); transform: scale(.9);
           transition: background .2s ease, color .2s ease, transform .25s cubic-bezier(.3, 1.6, .5, 1); }
  body[data-ready] button { background: var(--accent); color: #fff; transform: scale(1); }
  body[data-ready] button:active { transform: scale(.92); }
  button:focus-visible { box-shadow: 0 0 0 3px rgba(0, 137, 123, 0.55); outline: none; }
  @media (prefers-reduced-motion: reduce) { .bar, button { transition: none; } }
</style>
</head>
<body>
<canvas id="view"></canvas>
<form id="composer" autocomplete="off">
  <div class="bar">
    <input id="text" enterkeyhint="send" placeholder="Write a message" aria-label="Message">
    <button type="submit" aria-label="Send">
      <!-- Lucide's "send-horizontal" (https://lucide.dev, ISC licence) -->
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.714 3.048a.498.498 0 0 0-.683.627l2.843 7.627a2 2 0 0 1 0 1.396l-2.842 7.627a.498.498 0 0 0 .682.627l18-8.5a.5.5 0 0 0 0-.904z"/><path d="M6 12h16"/></svg>
    </button>
  </div>
</form>
<div id="message">Loading the chat…</div>
<script src="wasm_exec.js"></script>
<script>
  // Who writes: ?as=<name>, or the name given once on this device.
  function askName() {
    const given = new URLSearchParams(location.search).get("as");
    if (given) return given;
    let name = "";
    try { name = localStorage.getItem("llmcp-name") || ""; } catch (error) { /* private mode: ask each time */ }
    while (!/^[A-Za-z0-9._\/-]{1,64}$/.test(name)) {
      name = (prompt("Your name in the chat (letters, digits, - _ . /)") || "").trim();
    }
    try { localStorage.setItem("llmcp-name", name); } catch (error) { /* only a convenience */ }
    return name;
  }
  window.llmcpName = askName();

  const composer = document.getElementById("composer");
  const text = document.getElementById("text");
  let topic = "";
  // The Go program calls this with the open chat's topic, or "" to hide the bar, and the room it
  // left for the bar on the canvas, in the page's own pixels.
  const canvas = document.getElementById("view");
  window.llmcpWriteTo = (openTopic, x, y, width, height) => {
    topic = openTopic;
    if (!topic) {
      delete document.body.dataset.writing;
      return;
    }
    const bounds = canvas.getBoundingClientRect();
    Object.assign(composer.style, {
      left: bounds.left + x + "px", top: bounds.top + y + "px", width: width + "px", height: height + "px",
    });
    document.body.dataset.writing = "";
    text.placeholder = "Message " + nameOf(topic);
  };
  // nameOf is who or what a topic reaches: a pair ("alice+api") by the other session's name, as
  // the Go side names it (conversation.Name)
  const nameOf = (written) => {
    const [first, second] = written.split("+");
    if (second === undefined) return written.replace(/^@/, "");
    return first === window.llmcpName ? second : first;
  };
  window.llmcpFocusBar = () => text.focus();
  // the send button lights up once there is something to send
  text.addEventListener("input", () => {
    if (text.value.trim()) document.body.dataset.ready = ""; else delete document.body.dataset.ready;
  });
  composer.addEventListener("submit", async (event) => {
    event.preventDefault();
    const written = text.value.trim();
    if (!written || !topic) return;
    text.value = "";
    delete document.body.dataset.ready;
    const answer = await fetch("publish", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ as: window.llmcpName, topic, text: written }) });
    if (!answer.ok) { text.value = written; alert(await answer.text()); }
  });

  const message = document.getElementById("message");
  const go = new Go();
  WebAssembly.instantiateStreaming(fetch("chat.wasm"), go.importObject)
    .then((result) => { message.remove(); return go.run(result.instance); })
    .catch((error) => { message.textContent = "Could not start chat.wasm: " + error; });
</script>
</body>
</html>
