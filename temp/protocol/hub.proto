// The contract between the llmcp hub and its clients. Every call names the session that makes
// it; the hub answers errors with a gRPC status whose message starts with the error's code
// ("hub.session-not-found: alice").
syntax = "proto3";

package llmcp;

option go_package = "github.com/akrck02/LLM-CP/protocol";

// Hub is where sessions meet: they join, listen to topics, publish and read.
service Hub {
  // Join adds a session with a unique name.
  rpc Join(SessionRequest) returns (Done);
  // Leave removes a session and frees its name.
  rpc Leave(SessionRequest) returns (Done);
  // Sessions lists who has joined and what each one listens to.
  rpc Sessions(SessionRequest) returns (SessionList);
  // Listen makes a session listen to a topic.
  rpc Listen(ListenRequest) returns (Done);
  // Unlisten makes a session stop listening to a topic.
  rpc Unlisten(TopicRequest) returns (Done);
  // Publish adds a message to a topic.
  rpc Publish(PublishRequest) returns (Message);
  // Read gives the messages waiting for a session, waiting for one if asked to.
  rpc Read(ReadRequest) returns (MessageList);
  // Watch streams every message published to any topic, own topics included, and the hub's
  // state each time it changes, for a person looking on. Its first event is the state. It needs
  // no session: whoever can open the socket may watch.
  rpc Watch(WatchRequest) returns (stream Event);
  // CreateGroup makes a group: a topic with a theme and chosen members, who listen to it.
  rpc CreateGroup(GroupRequest) returns (Done);
  // AddMember adds a session to a group.
  rpc AddMember(MemberRequest) returns (Done);
  // RemoveMember takes a session out of a group.
  rpc RemoveMember(MemberRequest) returns (Done);
  // RemoveGroup turns a group back into a plain topic.
  rpc RemoveGroup(TopicRequest) returns (Done);
  // Groups lists every group with its theme and members.
  rpc Groups(SessionRequest) returns (GroupList);
  // Archive keeps a topic out of the list of chats; Restore brings it back.
  rpc Archive(TopicRequest) returns (Done);
  rpc Restore(TopicRequest) returns (Done);
  // Typing says a session started (or, with stopped, ended) thinking of an answer.
  rpc Typing(TypingRequest) returns (Done);
  // Declare gives a topic its kind ("conversation" or "metrics") for its whole life.
  rpc Declare(KindRequest) returns (Done);
  // RemoveTopic deletes a topic: its messages, its kind and every place in it.
  rpc RemoveTopic(TopicRequest) returns (Done);
}

message KindRequest {
  string session = 1;
  string topic = 2;
  string kind = 3;
}

// TopicKind is a declared topic: its kind, and who has published to it.
message TopicKind {
  string topic = 1;
  string kind = 2;
  repeated string publishers = 3;
}

message GroupRequest {
  string session = 1;
  string group = 2;
  string theme = 3;
  repeated string members = 4;
}

message MemberRequest {
  string session = 1;
  string group = 2;
  string member = 3;
}

message TypingRequest {
  string session = 1;
  bool stopped = 2;
}

message Group {
  string name = 1;
  string theme = 2;
  repeated string members = 3;
}

message GroupList {
  repeated Group groups = 1;
}

message Contact {
  string name = 1;
  repeated string topics = 2;
  repeated string groups = 3;
  // typing_until is when it stops showing as typing, in Unix milliseconds; 0 when it is not.
  int64 typing_until = 4;
  // last_seen is in Unix seconds.
  int64 last_seen = 5;
}

// State is everything a person looking on sees besides the messages, sent whole when it changes.
message State {
  repeated Contact contacts = 1;
  repeated Group groups = 2;
  repeated string archived = 3;
  repeated TopicKind kinds = 4;
}

message Event {
  oneof kind {
    Message message = 1;
    State state = 2;
  }
}

message WatchRequest {
  // past starts with every message the hub holds, oldest first.
  bool past = 1;
}

message SessionRequest {
  string session = 1;
}

message TopicRequest {
  string session = 1;
  string topic = 2;
}

message ListenRequest {
  string session = 1;
  string topic = 2;
  // past also gives the messages the topic held before listening.
  bool past = 3;
}

message PublishRequest {
  string session = 1;
  string topic = 2;
  string text = 3;
}

message ReadRequest {
  string session = 1;
  // wait_seconds is how long to wait for a message if none is waiting; 0 answers at once.
  uint32 wait_seconds = 2;
}

message Done {}

message Session {
  string name = 1;
  repeated string topics = 2;
}

message SessionList {
  repeated Session sessions = 1;
}

message Message {
  uint64 number = 1;
  string topic = 2;
  string from = 3;
  string text = 4;
  // published is in Unix seconds.
  int64 published = 5;
}

message MessageList {
  repeated Message messages = 1;
}
